name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, stop and use the private reporting link instead.
        Never paste content taken from a site that hosts illegal material. Describe it instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what did you get?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, configuration with secrets removed, and a benign onion address if one is needed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options: [Personal, Team, Public, Not sure]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove addresses, cookies, tokens and anything you would not post publicly.
      render: text
