name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Effect on the security properties
      description: Which properties in docs/threat-model.md could this touch, and how do you keep them intact?
    validations:
      required: false
