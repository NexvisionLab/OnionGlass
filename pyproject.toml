[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "onionglass"
version = "0.0.0"
description = "A self-hostable gateway for viewing .onion sites in an ordinary browser, with isolation, policy and evidence capture built in."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "NexvisionLab" }]
keywords = ["tor", "onion", "gateway", "security", "osint", "evidence"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=50,<51",
  "h11>=0.16,<1",
  "nh3>=0.3.7,<0.4",
  "selectolax>=1.0.2,<2",
  "tinycss2>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.13",
  "pytest-timeout==2.4.0",
  "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://github.com/NexvisionLab/onionglass"
Issues = "https://github.com/NexvisionLab/onionglass/issues"
Security = "https://github.com/NexvisionLab/onionglass/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/onionglass"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "TID", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603", "S607", "PLR0913", "E501", "PT018"]
# The rewriter is allowlist dispatch code: many small branches by design.
"src/onionglass/rewrite/*" = ["PLR0911", "PLR0912", "PLR0915"]
# Building a request header set is naturally keyword-heavy.
"src/onionglass/headers.py" = ["PLR0913"]
# A SOCKS exchange needs the target, proxy and credentials; the default password is not a secret.
"src/onionglass/socks.py" = ["PLR0913", "PLR0917", "S107"]
"src/onionglass/upstream.py" = ["PLR0912"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tinycss2", "tinycss2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --timeout=30"
markers = [
  "network: needs a real Tor connection, run only in the scheduled job",
]

[tool.coverage.run]
source = ["onionglass"]
branch = true

[tool.coverage.report]
show_missing = true
